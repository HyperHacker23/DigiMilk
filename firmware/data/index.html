<!-- firmware/data/index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Milk Dispenser</title>
  <style>
    /* (same CSS as previous, mobile-optimized) */
    :root {
      --bg: #f3f7f3;
      --card: #fff;
      --accent: #2e9e63;
      --muted: #6f846f;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: #123;
    }

    .container {
      max-width: 420px;
      margin: 10px auto;
      padding: 12px;
    }

    .header {
      text-align: center;
      margin-bottom: 6px;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      color: #173b2a;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 6px 18px rgba(26, 46, 34, 0.06);
    }

    .display {
      width: 100%;
      padding: 12px;
      font-size: 26px;
      border-radius: 10px;
      border: 1px solid #e6efe6;
      text-align: right;
      background: #fbfffb;

      /* FIXES */
      box-sizing: border-box;
      /* prevents overflow */
      margin-bottom: 10px;
      /* adds spacing from keypad */
    }


    .modes {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      margin-top: 10px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #dfeee0;
      background: #f7fbf7;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 4px 10px rgba(46, 158, 99, 0.14);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .key {
      padding: 14px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #e6efe6;
      font-size: 20px;
      cursor: pointer;
    }

    .key:active {
      transform: translateY(1px);
      opacity: 0.95;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .btn.stop {
      background: #d9534f;
    }

    .progress-wrap {
      margin-top: 12px;
      background: #eaf3ea;
      border-radius: 10px;
      padding: 6px;
    }

    .progress {
      height: 14px;
      background: #dcefd9;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress>.bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #67c78f);
      transition: width 260ms linear;
    }

    .status-row {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
    }

    .small {
      font-size: 13px;
      color: var(--muted);
    }

    #logsModal {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
    }

    #logsModal .box {
      width: 92%;
      max-width: 700px;
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      max-height: 85vh;
      overflow: auto;
    }

    .log-line {
      font-family: monospace;
      font-size: 13px;
      padding: 6px;
      border-bottom: 1px solid #f1f7f1;
    }

    .close {
      background: #eee;
      border: 0;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="title">Milk Dispenser</div>
    </div>
    <div class="card">
      <input id="display" class="display" readonly placeholder="Enter value">
      <div class="modes">
        <button id="bml" class="mode-btn active" onclick="setMode('ml')">mL</button>
        <button id="bl" class="mode-btn" onclick="setMode('litre')">Litre</button>
        <button id="bc" class="mode-btn" onclick="setMode('cost')">Cost</button>
      </div>
      <div class="keypad">
        <div class="key" onclick="press('1')">1</div>
        <div class="key" onclick="press('2')">2</div>
        <div class="key" onclick="press('3')">3</div>
        <div class="key" onclick="press('4')">4</div>
        <div class="key" onclick="press('5')">5</div>
        <div class="key" onclick="press('6')">6</div>
        <div class="key" onclick="press('7')">7</div>
        <div class="key" onclick="press('8')">8</div>
        <div class="key" onclick="press('9')">9</div>
        <div class="key" onclick="clearDisplay()">C</div>
        <div class="key" onclick="press('0')">0</div>
        <div class="key" onclick="preparePayment()">Pay & Dispense</div>
      </div>
      <div class="progress-wrap">
        <div class="progress">
          <div class="bar" id="bar"></div>
        </div>
        <div class="status-row">
          <div id="statLeft">Idle</div>
          <div id="statRight" class="small">0 / 0 mL</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn" onclick="openLogs()">View Logs</button>
        <button class="btn stop" onclick="clearAllLogs()">Clear Logs</button>
      </div>
      <div style="height:6px"></div>
      <div class="small">AP: MilkPoC (password 12345678)</div>
    </div>
  </div>

  <div id="logsModal">
    <div class="box">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 style="margin:0">Logs</h3><button class="close" onclick="closeLogs()">Close</button>
      </div>
      <div id="logContent" style="margin-top:8px"></div>
    </div>
  </div>

  <script>
    /* CONFIG - set these before use */
    const BACKEND_BASE = "http://192.168.1.7:3000"; // e.g. http://192.168.1.50:3000
    const RAZORPAY_KEY_ID = "rzp_test_Rim994s54pwgE9"; // public key id from Razorpay (test key)
    const PRICE_PER_LITER = 50.0; // must match ESP32 PRICE_PER_LITER

    let mode = 'ml';
    function setMode(m) { mode = m; document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active')); if (m === 'ml') document.getElementById('bml').classList.add('active'); if (m === 'litre') document.getElementById('bl').classList.add('active'); if (m === 'cost') document.getElementById('bc').classList.add('active'); }
    function press(v) { const d = document.getElementById('display'); d.value = (d.value || '') + v; }
    function clearDisplay() { document.getElementById('display').value = ''; }

    function computeAmountToCharge(inputValue, mode) {
      if (mode === 'ml') { let litres = inputValue / 1000.0; return +(litres * PRICE_PER_LITER).toFixed(2); }
      else if (mode === 'litre') return +(inputValue * PRICE_PER_LITER).toFixed(2);
      else return +(inputValue).toFixed(2); // cost mode
    }

    async function preparePayment() {
      const raw = document.getElementById('display').value;
      if (!raw) return alert('Enter a value');
      const value = parseFloat(raw);
      if (isNaN(value) || value <= 0) return alert('Invalid value');

      const amountINR = computeAmountToCharge(value, mode);
      if (amountINR <= 0) return alert('Computed amount is zero');

      try {
        const res = await fetch(`${BACKEND_BASE}/create_order`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: amountINR, currency: 'INR', client_value: value, client_mode: mode })
        });
        const order = await res.json();
        if (!order || !order.id) throw new Error('Order creation failed');

        const options = {
          key: RAZORPAY_KEY_ID,
          amount: order.amount,
          currency: order.currency,
          name: 'Milk Dispenser',
          description: `Pay ₹${amountINR.toFixed(2)} for ${value} ${mode}`,
          order_id: order.id,
          handler: function (response) {
            fetch(`${BACKEND_BASE}/verify_payment`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                razorpay_payment_id: response.razorpay_payment_id,
                razorpay_order_id: response.razorpay_order_id,
                razorpay_signature: response.razorpay_signature
              })
            }).then(r => r.json()).then(j => {
              if (j && j.success) {
                alert('Payment verified — dispensing started');
                document.getElementById('display').value = '';
                document.getElementById('statLeft').innerText = 'Dispensing...';
              } else {
                alert('Payment verification failed: ' + (j && j.error ? j.error : 'unknown'));
              }
            }).catch(e => { alert('Verify error'); console.error(e); });
          },
          theme: { color: '#2e9e63' }
        };
        const rzp = new Razorpay(options);
        rzp.open();
      } catch (err) {
        console.error(err);
        alert('Payment init failed: ' + err.message);
      }
    }

    // SSE + UI updates
    let evt = null;
    function setupSSE() {
      if (!!window.EventSource) {
        try {
          evt = new EventSource('/events');
          evt.onmessage = function (e) {
            try {
              const d = JSON.parse(e.data);
              if (d.hasOwnProperty('dispensing')) document.getElementById('statLeft').innerText = d.dispensing ? 'Dispensing...' : 'Idle';
              if (d.hasOwnProperty('dispensed_ml') && d.hasOwnProperty('target_ml')) {
                const pct = Math.min((d.dispensed_ml / Math.max(d.target_ml, 1)) * 100, 100);
                document.getElementById('bar').style.width = pct + '%';
                document.getElementById('statRight').innerText = Math.round(d.dispensed_ml) + ' / ' + Math.round(d.target_ml) + ' mL';
              }
            } catch (err) { console.error('SSE parse', err); }
          };
          evt.onerror = function (e) { console.log('SSE error', e); evt.close(); setTimeout(setupSSE, 2000); };
          evt.onopen = function () { console.log('SSE open'); fetchStatusOnce(); };
        } catch (err) { console.warn('SSE failed', err); setInterval(fetchStatusOnce, 1000); }
      } else {
        setInterval(fetchStatusOnce, 800);
      }
    }

    function fetchStatusOnce() {
      fetch('/status').then(r => r.json()).then(d => {
        if (d && d.target_ml && d.target_ml > 0) {
          const pct = Math.min((d.dispensed_ml / Math.max(d.target_ml, 1)) * 100, 100);
          document.getElementById('bar').style.width = pct + '%';
          document.getElementById('statRight').innerText = Math.round(d.dispensed_ml) + ' / ' + Math.round(d.target_ml) + ' mL';
          document.getElementById('statLeft').innerText = d.dispensing ? 'Dispensing...' : 'Idle';
        } else {
          document.getElementById('statLeft').innerText = 'Idle';
          document.getElementById('statRight').innerText = '0 / 0 mL';
        }
      }).catch(e => {/* ignore */ });
    }

    function openLogs() { fetch('/logs').then(r => r.text()).then(t => { const container = document.getElementById('logContent'); container.innerHTML = ''; if (!t || t.trim().length === 0) { container.innerHTML = '<div class="log-line">No logs</div>'; } else { let lines = t.split('\n'); lines.forEach(l => { if (l.trim().length === 0) return; const el = document.createElement('div'); el.className = 'log-line'; el.textContent = l; container.appendChild(el); }); } document.getElementById('logsModal').style.display = 'flex'; }); }
    function closeLogs() { document.getElementById('logsModal').style.display = 'none'; }
    function clearAllLogs() { fetch('/clearlogs').then(() => { alert('Logs cleared'); }); }

    setupSSE(); fetchStatusOnce(); setMode('ml');
  </script>
</body>

</html>
