<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Milk Dispenser</title>

  <style>
    :root {
      --bg: #f3f7f3;
      --card: #fff;
      --accent: #2e9e63;
      --muted: #6f846f;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: #123;
    }

    .container {
      max-width: 420px;
      margin: 10px auto;
      padding: 12px;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 6px;
      color: #173b2a;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 6px 18px rgba(26, 46, 34, 0.06);
    }

    .display {
      width: 100%;
      padding: 12px;
      font-size: 26px;
      border-radius: 10px;
      border: 1px solid #e6efe6;
      text-align: right;
      background: #fbfffb;
      margin-bottom: 10px;
      box-sizing: border-box;
    }

    .modes {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #dfeee0;
      background: #f7fbf7;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 4px 10px rgba(46, 158, 99, 0.14);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .key {
      padding: 14px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #e6efe6;
      font-size: 20px;
      cursor: pointer;
      text-align: center;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .btn.stop {
      background: #d9534f;
    }

    .progress-wrap {
      margin-top: 12px;
      background: #eaf3ea;
      border-radius: 10px;
      padding: 6px;
    }

    .progress {
      height: 14px;
      background: #dcefd9;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress>.bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #67c78f);
      transition: width 260ms linear;
    }

    .status-row {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
    }
  </style>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>

  <div class="container">
    <div class="title">Milk Dispenser</div>

    <div class="card">

      <input id="display" class="display" readonly placeholder="Enter value">

      <div class="modes">
        <button id="bml" class="mode-btn active" onclick="setMode('ml')">mL</button>
        <button id="bl" class="mode-btn" onclick="setMode('litre')">Litre</button>
        <button id="bc" class="mode-btn" onclick="setMode('cost')">Cost</button>
      </div>

      <div class="keypad">
        <div class="key" onclick="press('1')">1</div>
        <div class="key" onclick="press('2')">2</div>
        <div class="key" onclick="press('3')">3</div>
        <div class="key" onclick="press('4')">4</div>
        <div class="key" onclick="press('5')">5</div>
        <div class="key" onclick="press('6')">6</div>
        <div class="key" onclick="press('7')">7</div>
        <div class="key" onclick="press('8')">8</div>
        <div class="key" onclick="press('9')">9</div>
        <div class="key" onclick="clearDisplay()">C</div>
        <div class="key" onclick="press('0')">0</div>
        <div class="key" onclick="preparePayment()">Pay & Dispense</div>
      </div>

      <div class="progress-wrap">
        <div class="progress">
          <div id="bar" class="bar"></div>
        </div>
        <div class="status-row">
          <div id="statLeft">Idle</div>
          <div id="statRight">0 / 0 mL</div>
        </div>
      </div>

      <div class="actions">
        <button class="btn" onclick="openLogs()">View Logs</button>
        <button class="btn stop" onclick="clearAllLogs()">Clear Logs</button>
      </div>

      <div style="margin-top:10px;" class="small">AP: MilkPoC (password 12345678)</div>
    </div>
  </div>

  <div id="logsModal" style="display:none;">
    <div class="box">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3>Logs</h3>
        <button class="close" onclick="closeLogs()">Close</button>
      </div>
      <div id="logContent"></div>
    </div>
  </div>

  <script>

    const BACKEND_BASE = "http://192.168.1.14:3000";
    const RAZORPAY_KEY_ID = "rzp_test_Rim994s54pwgE9";
    const PRICE_PER_LITER = 50.0;

    let mode = 'ml';

    function setMode(m) {
      mode = m;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      document.getElementById("b" + (m === "ml" ? "ml" : m === "litre" ? "l" : "c")).classList.add("active");
    }

    function press(v) {
      const d = document.getElementById('display');
      d.value = (d.value || '') + v;
    }

    function clearDisplay() {
      document.getElementById('display').value = '';
    }

    function computeAmountToCharge(v, m) {
      if (m === 'ml') return +((v / 1000) * PRICE_PER_LITER).toFixed(2);
      if (m === 'litre') return +(v * PRICE_PER_LITER).toFixed(2);
      return +v.toFixed(2);
    }

    async function preparePayment() {
      const raw = document.getElementById('display').value;
      if (!raw) return alert("Enter a value");

      const value = parseFloat(raw);
      if (isNaN(value) || value <= 0) return alert("Invalid value");

      const amountINR = computeAmountToCharge(value, mode);

      try {
        let res = await fetch(`${BACKEND_BASE}/create_order`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ amount: amountINR, currency: "INR", client_value: value, client_mode: mode })
        });

        let order = await res.json();
        if (!order.id) throw new Error("Order creation failed");

        const options = {
          key: RAZORPAY_KEY_ID,
          amount: order.amount,
          currency: order.currency,
          order_id: order.id,
          name: "Milk Dispenser",

          handler: function (resp) {
            fetch(`${BACKEND_BASE}/verify_payment`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(resp)
            }).then(r => r.json()).then(j => {
              if (j.success) {
                document.getElementById('statLeft').innerText = "Dispensing...";
                clearDisplay();
              } else alert("Verification failed");
            });
          },

          theme: { color: "#2e9e63" }
        };

        new Razorpay(options).open();

      } catch (e) { alert("Payment failed: " + e); }
    }

    function updateStatus(d) {
      if (!d) return;
      const ml = d.dispensed_ml || 0;
      const pct = Math.min((ml / Math.max(d.target_ml, 1)) * 100, 100);

      document.getElementById('bar').style.width = pct + '%';
      document.getElementById('statLeft').innerText = d.dispensing ? "Dispensing..." : "Idle";
      document.getElementById('statRight').innerText = `${Math.round(ml)} / ${Math.round(d.target_ml)} mL`;
    }

    function setupSSE() {
      try {
        const evt = new EventSource('/events');
        evt.onmessage = e => updateStatus(JSON.parse(e.data));
        evt.onerror = () => { evt.close(); setTimeout(setupSSE, 2000); };
      } catch {
        setInterval(() => {
          fetch('/status').then(r => r.json()).then(updateStatus);
        }, 1000);
      }
    }

    function openLogs() {
      fetch('/logs').then(r => r.text()).then(txt => {
        const box = document.getElementById('logContent');
        box.innerHTML = "";
        txt.split("\n").forEach(line => {
          if (!line.trim()) return;
          const div = document.createElement('div');
          div.textContent = line;
          box.appendChild(div);
        });
        document.getElementById('logsModal').style.display = "flex";
      });
    }

    function closeLogs() {
      document.getElementById('logsModal').style.display = "none";
    }

    function clearAllLogs() {
      fetch('/clearlogs').then(() => alert("Logs cleared"));
    }

    setupSSE();
    setMode('ml');

  </script>
</body>

</html>
