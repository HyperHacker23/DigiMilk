<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Milk Dispenser</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #222;
      color: #eee;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 400px;
      margin: auto;
      background: #333;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    input#display {
      width: 100%;
      font-size: 2em;
      padding: 10px;
      margin-bottom: 15px;
      background: #000;
      color: #0f0;
      border: none;
      text-align: right;
      border-radius: 5px;
      box-sizing: border-box;
    }

    .progress-track {
      background: #444;
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 15px;
      border: 1px solid #555;
    }

    .progress-bar {
      height: 100%;
      background: #00ccff;
      width: 0%;
      transition: width 0.3s ease;
    }

    .mode-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px;
      background: #444;
      border: none;
      color: #aaa;
      cursor: pointer;
      border-radius: 5px;
      margin: 0 2px;
      font-weight: bold;
    }

    .mode-btn.active {
      background: #00ccff;
      color: #000;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    button {
      padding: 15px;
      font-size: 1.2em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #555;
      color: white;
      transition: 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-green {
      background: #28a745;
      grid-column: span 3;
      font-weight: bold;
    }

    .btn-red {
      background: #dc3545;
    }

    .btn-yellow {
      background: #ffc107;
      color: #000;
    }

    .status-panel {
      margin-top: 20px;
      padding: 10px;
      background: #2a2a2a;
      border-radius: 8px;
      font-size: 0.9em;
      text-align: left;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid #444;
    }

    details {
      margin-top: 20px;
      text-align: left;
      background: #222;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #444;
    }

    summary {
      cursor: pointer;
      color: #aaa;
      font-weight: bold;
    }

    .cal-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .cal-controls button {
      font-size: 0.9em;
      padding: 10px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Smart Dispenser</h2>
    <input type="text" id="display" placeholder="0" readonly>
    <div class="progress-track">
      <div id="bar" class="progress-bar"></div>
    </div>
    <div class="mode-row">
      <button id="bml" class="mode-btn active" onclick="setMode('ml')">mL</button>
      <button id="bl" class="mode-btn" onclick="setMode('litre')">Litre</button>
      <button id="bc" class="mode-btn" onclick="setMode('cost')">₹ Cost</button>
    </div>
    <div class="keypad">
      <button onclick="press(1)">1</button><button onclick="press(2)">2</button><button onclick="press(3)">3</button>
      <button onclick="press(4)">4</button><button onclick="press(5)">5</button><button onclick="press(6)">6</button>
      <button onclick="press(7)">7</button><button onclick="press(8)">8</button><button onclick="press(9)">9</button>
      <button onclick="clearDisplay()" class="btn-yellow">CLR</button>
      <button onclick="press(0)">0</button>
      <button onclick="stopDispense()" class="btn-red">STOP</button>
      <button onclick="initiatePayment()" class="btn-green">PAY & POUR</button>
    </div>
    <div class="status-panel">
      <div class="row"><span>State:</span> <span id="statLeft">Idle</span></div>
      <div class="row"><span>Progress:</span> <span id="statRight">0 / 0 mL</span></div>
      <div class="row"><span>Cal Factor:</span> <span id="lastCal">Loading...</span></div>
    </div>
    <details>
      <summary>⚙️ Calibration Settings</summary>
      <div class="cal-controls">
        <button id="calStartBtn" onclick="startCal()" class="btn-yellow">Start Pump</button>
        <button id="calStopBtn" onclick="stopCal()" disabled class="btn-red">Stop (100mL)</button>
        <button onclick="saveCalibration()">Save Value</button>
        <button onclick="resetCalibration()">Reset All</button>
      </div>
    </details>
  </div>

  <script>
    // ================= CONFIGURATION =================
    // CHANGE THIS TO YOUR PC'S IP ADDRESS (Run ipconfig in CMD)
    const BACKEND_URL = "http://192.168.1.2:3000";

    const PRICE_PER_LITER = 50.0;
    const DISPENSE_TOKEN = "DMTKN_4nFh92xQ7sY8wLf0BqZp3cR1vKdTg";
    let mode = "ml";

    function setMode(m) {
      mode = m;
      document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
      if (m === "ml") document.getElementById("bml").classList.add("active");
      if (m === "litre") document.getElementById("bl").classList.add("active");
      if (m === "cost") document.getElementById("bc").classList.add("active");
    }

    function press(v) { document.getElementById("display").value += v; }
    function clearDisplay() { document.getElementById("display").value = ""; }

    async function initiatePayment() {
      let val = parseFloat(document.getElementById("display").value);
      if (!val || val <= 0) return alert("Enter valid amount");

      let amountInRupees = 0;
      if (mode === "ml") amountInRupees = (val / 1000) * PRICE_PER_LITER;
      else if (mode === "litre") amountInRupees = val * PRICE_PER_LITER;
      else if (mode === "cost") amountInRupees = val;
      if (amountInRupees < 1) amountInRupees = 1;

      document.getElementById("statLeft").innerText = "Creating Order...";
      try {
        const res = await fetch(`${BACKEND_URL}/create_order`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ amount: amountInRupees, client_value: val, client_mode: mode })
        });
        const orderData = await res.json();
        if (!res.ok) throw orderData.error || "Server Error";

        const rzp1 = new Razorpay({
          "key": orderData.key_id, "amount": orderData.amount, "currency": orderData.currency,
          "name": "Milk Dispenser", "description": `Dispensing ${val} ${mode}`, "order_id": orderData.id,
          "handler": function (response) { verifyPayment(response); }, "theme": { "color": "#00ccff" }
        });
        rzp1.open();
        document.getElementById("statLeft").innerText = "Waiting for Pay...";
      } catch (e) { alert("Order Failed: " + e); document.getElementById("statLeft").innerText = "Error"; }
    }

    async function verifyPayment(response) {
      document.getElementById("statLeft").innerText = "Verifying...";
      try {
        const res = await fetch(`${BACKEND_URL}/verify_payment`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ razorpay_payment_id: response.razorpay_payment_id, razorpay_order_id: response.razorpay_order_id, razorpay_signature: response.razorpay_signature })
        });
        const result = await res.json();
        if (result.success) { alert("Payment Success! Pump Starting..."); clearDisplay(); }
        else { alert("Payment Verification Failed: " + result.error); }
      } catch (e) { alert("Network Error: " + e); }
    }

    async function stopDispense() { await fetch("/stop", { method: "POST", headers: { "X-DISPENSE-TOKEN": DISPENSE_TOKEN } }); }
    async function startCal() { document.getElementById("calStartBtn").disabled = true; document.getElementById("calStopBtn").disabled = false; await fetch("/calibrate/start", { method: "POST", headers: { "X-DISPENSE-TOKEN": DISPENSE_TOKEN } }); }
    async function stopCal() { document.getElementById("calStopBtn").disabled = true; let r = await fetch("/calibrate/stop", { method: "POST", headers: { "X-DISPENSE-TOKEN": DISPENSE_TOKEN } }); let j = await r.json(); alert(`Sample: ${j.last_sample_ms}ms | Avg: ${j.average_ms}ms`); document.getElementById("calStartBtn").disabled = false; }
    async function saveCalibration() { await fetch("/calibrate/save", { method: "POST", headers: { "X-DISPENSE-TOKEN": DISPENSE_TOKEN } }); alert("Saved!"); }
    async function resetCalibration() { if (confirm("Reset?")) await fetch("/calibrate/reset", { method: "POST", headers: { "X-DISPENSE-TOKEN": DISPENSE_TOKEN } }); }

    function setupSSE() {
      const evt = new EventSource("/events");
      evt.onmessage = e => {
        try {
          const d = JSON.parse(e.data);
          if (d.saved_ms_per_100ml) document.getElementById("lastCal").innerText = d.saved_ms_per_100ml.toFixed(0) + " ms/100mL";
          const pct = Math.min((d.dispensed_ml / Math.max(d.target_ml, 1)) * 100, 100);
          document.getElementById("bar").style.width = pct + "%";
          if (d.calibrating) document.getElementById("statLeft").innerText = "Calibrating...";
          else if (d.dispensing) document.getElementById("statLeft").innerText = "Dispensing...";
          else if (document.getElementById("statLeft").innerText !== "Verifying..." && document.getElementById("statLeft").innerText !== "Waiting for Pay...") document.getElementById("statLeft").innerText = "Idle";
          document.getElementById("statRight").innerText = Math.round(d.dispensed_ml || 0) + " / " + Math.round(d.target_ml || 0) + " mL";
        } catch { }
      };
      evt.onerror = () => { evt.close(); setTimeout(setupSSE, 2000); };
    }
    setupSSE();
    setMode("ml");
  </script>
</body>

</html>
